name: Slack Notify
description: Send a Slack notification (used by review workflows)

inputs:
  webhook_url:
    required: true
    description: Slack webhook URL
  message:
    required: true
    description: >-
      Message text to send, in Slack mrkdwn. Each {title} in it is replaced
      by the title input, escaped.
  title:
    required: false
    default: ""
    description: >-
      Pull request title. Control characters become spaces, bidirectional
      control characters are removed, a title over
      200 characters (counted as Unicode code points) keeps its first 200
      and gets "..." added, and &, < and > are escaped, so it cannot carry
      <...> markup: a user, channel or group mention, or a link with its own
      label. Slack still applies * _ ~ ` formatting and still links a bare
      URL as written. Put {title} in the message where it goes, rather than
      putting the raw title in the message.

runs:
  using: composite
  steps:
    - name: Send notification
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.webhook_url }}
        INPUT_MESSAGE: ${{ inputs.message }}
        INPUT_TITLE: ${{ inputs.title }}
      run: |
        if [ -z "$SLACK_WEBHOOK_URL" ]; then
          echo "::warning::SLACK_WEBHOOK_URL is empty — skipping notification"
          exit 0
        fi
        # The URL is the secret, so it reaches curl as a config line on stdin
        # rather than as an argument (#66). Arguments show in any user's
        # process list; the environment below is readable only by this user,
        # which every step of the job already is. A quote, backslash, whitespace or control character
        # would break out of the config's quoted string, so such a URL is
        # refused.
        if [[ "$SLACK_WEBHOOK_URL" =~ [\"\\[:space:][:cntrl:]] ]]; then
          echo "::warning::SLACK_WEBHOOK_URL holds a quote, backslash or whitespace — skipping notification"
          exit 0
        fi
        # The title is the pull request author's text, and Slack reads <...>
        # as a mention or a link, so it is made plain before it goes in (#62).
        # Bidirectional controls are removed, so the title cannot reorder the
        # text around it (#75). It is cut before escaping, so an escape is
        # never cut in half.
        # split and join replace {title} in one pass: a title holding
        # {title} is not expanded again.
        PAYLOAD=$(jq -n --arg msg "$INPUT_MESSAGE" --arg title "$INPUT_TITLE" '
          ($title | gsub("[[:cntrl:]]"; " ") | gsub("[\u061c\u200e\u200f\u202a-\u202e\u2066-\u2069]"; "")) as $t
          | (if ($t | length) > 200 then $t[:200] + "..." else $t end)
          | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")
          | . as $safe
          | {text: ($msg | split("{title}") | join($safe))}')
        printf 'url = "%s"\n' "$SLACK_WEBHOOK_URL" | curl -sf -K - -X POST \
          -H 'Content-Type: application/json' \
          -d "$PAYLOAD"
