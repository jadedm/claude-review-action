name: Tests

# Runs this repository's own tests. Not part of the reusable review workflows.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gemini reply parser (#8)
        run: python3 scripts/test_gemini_review_parse.py
      - name: Gemini comment builder (#8)
        run: python3 scripts/test_gemini_review_comment.py
      - name: Gemini payload caps (#29)
        run: python3 scripts/test_gemini_payload.py
      - name: Gemini review merge (#30)
        run: python3 scripts/test_gemini_review_merge.py
      - name: Gemini parallel calls (#30)
        run: python3 scripts/test_gemini_calls.py
      - name: Gemini provider check (#55)
        run: python3 scripts/test_gemini_provider.py
      - name: Gemini Vertex workflow (#55)
        run: python3 scripts/test_gemini_vertex_workflow.py
      - name: Safe extras path (#35)
        run: python3 scripts/test_safe_path.py
      - name: Claude skip notice (#15)
        run: python3 scripts/test_claude_skip.py
      - name: Slack step guard (#59)
        run: python3 scripts/test_slack_guard.py
      - name: Slack webhook off the command line (#66)
        run: python3 scripts/test_slack_notify.py
      - name: Vertex setup admits release commits only (#66)
        run: python3 scripts/test_setup_vertex_wif.py
      - name: Claude runs on the job's token (#66)
        run: python3 scripts/test_credentials.py
      - name: Rules from the base branch (#37)
        run: python3 scripts/test_base_file.py
      - name: Repo protection script (sandbox#60)
        run: python3 scripts/test_repo_protection.py
      - name: README against the workflows (#48)
        run: python3 scripts/test_docs.py
