name: Gemini Review (reusable)

on:
  workflow_call:
    inputs:
      stack:
        description: 'Stack-specific prompt to load from prompts/<stack>.md (e.g. nestjs-fastify-drizzle)'
        type: string
        required: true
      runner:
        description: 'JSON-encoded runs-on value (e.g. "ubuntu-latest" or "[\"self-hosted\",\"aws\",\"spot\"]")'
        type: string
        default: '"ubuntu-latest"'
      ref:
        description: 'Ref of this repo to load prompts, scripts and the Slack action from (tag / branch / sha). Set it to the same SHA when pinning this workflow by SHA'
        type: string
        default: 'v1'
      model:
        description: 'Gemini model name'
        type: string
        default: 'gemini-4-argon'
      thinking_level:
        description: 'How hard Gemini thinks before reviewing: minimal, low, medium or high. none or an empty value sends no thinking setting, which leaves gemini-4-argon not thinking at all; ignored for gemini-1.x and 2.x models (#33)'
        type: string
        default: 'high'
      max_total_lines:
        description: 'Max total source lines per Gemini call'
        type: number
        default: 20000
      max_per_file:
        description: 'Skip files larger than this many lines'
        type: number
        default: 3000
      max_files:
        description: 'Max number of files per Gemini call'
        type: number
        default: 50
      max_diff_lines:
        description: 'Max diff lines per Gemini call'
        type: number
        default: 5000
      max_payload_bytes:
        description: 'Max bytes of diff plus source per Gemini call. Line caps miss a file with very long lines'
        type: number
        default: 2000000
      max_chunks:
        description: 'Large pull requests are split into up to this many parallel Gemini calls, each within the caps above (1 to 5; 1 is a single call)'
        type: number
        default: 3
      slack_notify:
        description: 'Whether to send a Slack notification after the run'
        type: boolean
        default: false
      extra_prompt:
        description: 'Optional repo-specific addendum appended after the stack prompt. Use this for short inline notes; for long-form content prefer extra_prompt_path.'
        type: string
        default: ''
      extra_prompt_path:
        description: 'Optional path (relative to the consumer repo root) to a markdown file whose contents are appended after the stack prompt — e.g. .github/review-extras.md. Cleaner than a multi-line YAML string for long-form repo-specific conventions. If both extra_prompt and extra_prompt_path are set, both are appended (file contents first, then inline string).'
        type: string
        default: ''
    secrets:
      gemini_api_key:
        required: true
      slack_webhook_url:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini:
    # Trigger paths:
    #   - pull_request: every push / open / reopen / ready_for_review
    #   - issue_comment containing @gemini: top-level PR comments
    #   - pull_request_review_comment containing @gemini: inline review-thread
    #     replies (parity with the Claude reusable, which already handles this)
    # On a public repo anyone can comment, and each comment spends the
    # caller's API quota; only people with a role in the repo may trigger it.
    # Private repos skip the check: only people with access can comment, and
    # author_association can misreport private org membership.
    if: >
      github.event_name == 'pull_request' ||
      ((github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@gemini')) ||
       (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@gemini'))) &&
      (github.event.repository.private ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ fromJSON(inputs.runner) }}
    concurrency:
      group: gemini-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # Nothing later needs git credentials, and a saved token in
          # .git/config is one file read away from the prompt (#29).
          persist-credentials: false

      - name: Checkout review action repo (prompts)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: jadedm/claude-review-action
          ref: ${{ inputs.ref }}
          path: .claude-review-action
          token: ${{ github.token }}

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            if command -v dnf &> /dev/null; then
              sudo dnf install -y 'dnf-command(config-manager)' || true
              sudo dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
              sudo dnf install -y gh
            elif command -v apt-get &> /dev/null; then
              type -p curl >/dev/null || sudo apt-get install -y curl
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
              sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
              sudo apt-get update && sudo apt-get install -y gh
            fi
          fi

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GitHub refuses the whole-PR diff past 300 files or 20,000 lines
          # (HTTP 406 "diff exceeded the maximum number of files"), which
          # failed the review outright on large PRs. Fall back to the
          # per-file patches of the paginated files API, which has no such
          # cap. Only the first max_diff_lines lines are sent to the model
          # either way.
          if ! gh pr diff "$PR_NUMBER" > /tmp/pr-diff.txt 2> /tmp/pr-diff.err; then
            if grep -qiE '406|too_large|exceeded the maximum' /tmp/pr-diff.err; then
              echo "::notice::PR diff too large for the diff API; using per-file patches"
              gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
                --jq '.[] | "diff --git a/\(.filename) b/\(.filename)\n\(.patch // "(patch omitted by GitHub: file too large)")"' \
                > /tmp/pr-diff.txt
            else
              cat /tmp/pr-diff.err >&2
              exit 1
            fi
          fi
          echo "lines=$(wc -l < /tmp/pr-diff.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Collect changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # Resolve the file list via the GitHub API rather than
          # `git diff origin/<base>...HEAD`. The git-diff approach breaks on
          # `issue_comment` events because `github.event.pull_request.base.ref`
          # is empty there — the command expands to `git diff origin/...HEAD`,
          # silently emits nothing, and the whole review is skipped without
          # an error. The REST files API works for both `pull_request` and
          # `issue_comment` payloads, and --paginate reads every page:
          # `gh pr view --json files` stopped at the first 100 files, so a
          # large PR silently lost the rest.
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' > /tmp/all-changed-files.txt
          # grep exits 1 when it keeps nothing (a lockfile-only PR); that is
          # a valid empty list, not a failure. The API call above is not
          # covered by this, so an API error still fails the step.
          { grep -v -E '\.(lock|min\.(js|css)|map|snap|png|jpg|jpeg|gif|svg|ico|woff|ttf|eot)$' /tmp/all-changed-files.txt || [ $? -eq 1 ]; } \
            | { grep -v -E '(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|dist/|node_modules/|coverage/)' || [ $? -eq 1 ]; } \
            > /tmp/changed-files.txt
          echo "count=$(wc -l < /tmp/changed-files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Build review payload
        if: steps.files.outputs.count > 0
        id: payload
        env:
          MAX_TOTAL_LINES: ${{ inputs.max_total_lines }}
          MAX_PER_FILE: ${{ inputs.max_per_file }}
          MAX_FILES: ${{ inputs.max_files }}
          MAX_DIFF_LINES: ${{ inputs.max_diff_lines }}
          MAX_PAYLOAD_BYTES: ${{ inputs.max_payload_bytes }}
          MAX_CHUNKS: ${{ inputs.max_chunks }}
          # IMPORTANT: pass user-controlled inputs via env, NEVER interpolate
          # ${{ inputs.* }} directly into bash. Direct interpolation lets
          # backticks / $(...) inside a consumer's extra_prompt run as shell
          # commands in the runner where gemini_api_key is exported.
          STACK: ${{ inputs.stack }}
          EXTRA_PROMPT: ${{ inputs.extra_prompt }}
          EXTRA_PROMPT_PATH: ${{ inputs.extra_prompt_path }}
        run: |
          set -euo pipefail
          ROOT=".claude-review-action"
          BASE="$ROOT/prompts/base.md"
          STACK_FILE="$ROOT/prompts/${STACK}.md"

          if [ ! -f "$BASE" ] || [ ! -f "$STACK_FILE" ]; then
            echo "::error::base or stack prompt not found"
            exit 1
          fi

          # Split the pull request into up to max_chunks calls, each within
          # the caps, and record every file no call will see (#29, #30).
          # Python rather than bash: it reads files by name without shell
          # parsing, never follows a PR's symlinks, and cuts on whole UTF-8
          # characters. It prints the number of calls.
          rm -rf /tmp/review-chunks
          CALLS=$(python3 "$ROOT/scripts/gemini_chunks.py" /tmp/review-chunks)
          echo "calls=${CALLS}" >> "$GITHUB_OUTPUT"

          {
            cat "$BASE"
            echo ""
            cat "$STACK_FILE"
            # Optional repo-specific addendum from a file inside the
            # consumer repo + the optional inline string. Either or both
            # are appended under a single "Repo-specific notes" heading;
            # file contents render first, inline string second.
            EXTRAS_RENDERED=0
            if [ -n "$EXTRA_PROMPT_PATH" ] && [ -f "$EXTRA_PROMPT_PATH" ]; then
              echo ""
              echo "## Repo-specific notes"
              echo ""
              cat "$EXTRA_PROMPT_PATH"
              EXTRAS_RENDERED=1
            elif [ -n "$EXTRA_PROMPT_PATH" ]; then
              echo "::warning::extra_prompt_path '$EXTRA_PROMPT_PATH' not found in consumer repo — skipping" >&2
            fi
            if [ -n "$EXTRA_PROMPT" ]; then
              if [ "$EXTRAS_RENDERED" -eq 0 ]; then
                echo ""
                echo "## Repo-specific notes"
                echo ""
              fi
              printf '%s\n' "$EXTRA_PROMPT"
            fi
            # Output-format instructions live in prompts/_gemini-tail.md.
            # Inlining them here as a bash heredoc broke YAML parsing because
            # the heredoc body sat at column 1, outside the `run: |` literal
            # scalar — Actions failed the workflow with "error parsing called
            # workflow" the moment a consumer invoked the reusable.
            echo ""
            cat "$ROOT/prompts/_gemini-tail.md"
          } > /tmp/review-prompt.txt

      - name: Call Gemini API
        if: steps.files.outputs.count > 0
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.gemini_api_key }}
          GEMINI_MODEL: ${{ inputs.model }}
          THINKING_LEVEL: ${{ inputs.thinking_level }}
        run: |
          set -euo pipefail
          PROMPT=$(cat /tmp/review-prompt.txt)
          # Only a known level reaches the request body, so the input cannot add JSON.
          # gemini-4-argon does no thinking unless asked; with high it found the most
          # defects and no false ones in a blind comparison (jadedm/sandbox#101).
          case "$THINKING_LEVEL" in
            ""|none) THINKING="" ;;
            minimal|low|medium|high) THINKING=", \"thinkingConfig\": {\"thinkingLevel\": \"${THINKING_LEVEL}\"}" ;;
            *) echo "::error::thinking_level must be none, minimal, low, medium or high, got '${THINKING_LEVEL}'"; exit 1 ;;
          esac
          # Gemini 1.x and 2.x take thinkingBudget, not thinkingLevel, and answer
          # 400 to it, so a caller pinned to one keeps working unchanged.
          case "$GEMINI_MODEL" in
            gemini-1*|gemini-2*)
              [ -n "$THINKING" ] && echo "::notice::${GEMINI_MODEL} does not take thinking_level; sending none"
              THINKING="" ;;
          esac
          API_URL="https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent"

          # Thinking models spend output tokens on thinking, and they count
          # against maxOutputTokens. A 5,000-line payload took 110 s and 15,420
          # output tokens on gemini-3.1-pro-preview, and 22 to 31 s on
          # gemini-4-argon (#27). At the #29 caps, 238k prompt tokens took 28 s
          # on gemini-4-argon; 137k took 241 s on gemini-3.8-flash, which
          # thinks longer (it was before the 420 s limit). With
          # thinking on, argon took up to 232 s on a 210k-token request (#33), so
          # each call now gets 420 s.
          #
          # One call per chunk (#30), run in parallel. A call records its
          # outcome in <dir>/status (ok, unreadable or failed) and never ends
          # the step itself, so one failed call cannot cancel the others; the
          # merge below decides what the step does.
          call_chunk() {
            local dir=$1 result="$1/result.json" attempt http rc full escaped
            full="${PROMPT}

          ## Changed Files

          $(cat "$dir/code.txt")

          ## Git Diff

          $(cat "$dir/diff.txt")"
            escaped=$(printf '%s\n' "$full" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.buffer.read().decode("utf-8", "replace")))')
            for attempt in 1 2 3; do
              rc=0
              http=$(curl -s -w "%{http_code}" -o "$result" \
                "$API_URL" \
                -H 'Content-Type: application/json' \
                -H "X-goog-api-key: ${GEMINI_API_KEY}" \
                --max-time 420 \
                -X POST \
                -d @- <<CURL_EOF
          {
            "contents": [{"parts": [{"text": ${escaped}}]}],
            "generationConfig": {
              "maxOutputTokens": 65536,
              "temperature": 1.0,
              "responseMimeType": "application/json"${THINKING}
            }
          }
          CURL_EOF
              ) || rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "Gemini API request failed (curl exit ${rc}; 28 means no reply within 420 s)"
                echo failed > "$dir/status"
                return 0
              fi
              if [ "$http" = "200" ]; then break; fi
              if [ "$http" != "429" ] && [ "$http" != "503" ]; then
                echo "Gemini API error (HTTP ${http}):"
                cat "$result"; echo
                echo failed > "$dir/status"
                return 0
              fi
              [ "$attempt" -lt 3 ] && sleep $((5 * attempt))
            done
            if [ "$http" != "200" ]; then
              echo "Gemini API failed after 3 attempts (last HTTP ${http}):"
              cat "$result"; echo
              echo failed > "$dir/status"
              return 0
            fi
            # Gemini quotes code with backslashes such as \d inside its JSON
            # reply; the parser repairs those escapes (#8). Exit 2 means the
            # reply was unreadable, and the raw text stays in this log only.
            python3 -c 'import json, sys; u = json.load(open(sys.argv[1])).get("usageMetadata", {}); print("Tokens: prompt %s, thinking %s, output %s" % (u.get("promptTokenCount"), u.get("thoughtsTokenCount", "not reported"), u.get("candidatesTokenCount")))' "$result" 2>/dev/null || echo "Tokens: unreadable"
            rc=0
            python3 .claude-review-action/scripts/gemini_review_parse.py "$result" "$dir/review.json" || rc=$?
            if [ "$rc" -eq 0 ]; then echo ok > "$dir/status"; return 0; fi
            if [ "$rc" -eq 2 ]; then echo unreadable > "$dir/status"; return 0; fi
            echo failed > "$dir/status"
          }

          # No match (zero planned calls) leaves both loops empty rather than
          # running them once on the literal pattern.
          shopt -s nullglob
          for dir in /tmp/review-chunks/*/; do
            call_chunk "${dir%/}" > "${dir%/}/log" 2>&1 &
          done
          wait  # each call wrote its own status; a missing status counts as failed

          for dir in /tmp/review-chunks/*/; do
            echo "::group::Call ${dir%/}: $(cat "${dir}status" 2>/dev/null || echo failed)"
            cat "${dir}log"
            echo "::endgroup::"
          done

          # One review from all calls. Exit 1 when every call failed; when
          # none succeeded but one was unreadable, it writes the unreadable
          # marker and the next step posts the fixed notice and fails, as before.
          python3 .claude-review-action/scripts/gemini_review_merge.py /tmp/review-chunks /tmp/gemini-review.json /tmp/review-coverage.json

      - name: Post review comment
        if: steps.files.outputs.count > 0
        id: post-review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every field Gemini returns is untrusted: it read the pull request.
          # The builder renders it inert (no mentions, links, images or HTML)
          # and keeps the comment under GitHub's size limit.
          COMMENT=$(python3 .claude-review-action/scripts/gemini_review_comment.py /tmp/gemini-review.json /tmp/review-coverage.json)
          gh pr comment ${{ github.event.pull_request.number || github.event.issue.number }} --body "$COMMENT"

          if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/gemini-review.json')).get('nothing_sent') else 1)"; then
            echo "assessment=not_reviewed" >> "$GITHUB_OUTPUT"
            echo "issue_count=n/a" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/gemini-review.json')).get('unparsed') else 1)"; then
            echo "assessment=unparsed" >> "$GITHUB_OUTPUT"
            echo "issue_count=?" >> "$GITHUB_OUTPUT"
            echo "::error::Gemini's reply could not be read as a review; see the Call Gemini API step log"
            exit 1
          fi

          # Only a known verdict reaches the outputs: the model's own text could
          # carry a newline and write extra output lines.
          echo "assessment=$(python3 -c "import json; a=json.load(open('/tmp/gemini-review.json')).get('overall_assessment'); print(a if a in ('approve','comment','request_changes') else 'other')")" >> "$GITHUB_OUTPUT"
          echo "issue_count=$(python3 -c "import json; print(len(json.load(open('/tmp/gemini-review.json')).get('issues', [])))")" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always() && inputs.slack_notify && github.event_name == 'pull_request'
        uses: ./.claude-review-action/actions/slack-notify
        with:
          webhook_url: ${{ secrets.slack_webhook_url }}
          message: |
            💎 *Gemini* reviewed PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            Repo: ${{ github.repository }} | Assessment: ${{ steps.post-review.outputs.assessment || 'error' }} | Issues: ${{ steps.post-review.outputs.issue_count || '?' }}
            <${{ github.event.pull_request.html_url }}|View PR>
