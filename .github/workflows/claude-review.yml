name: Claude Review (reusable)

on:
  workflow_call:
    inputs:
      stack:
        description: 'Stack-specific prompt to load from prompts/<stack>.md (e.g. nestjs-fastify-drizzle)'
        type: string
        required: true
      runner:
        description: 'JSON-encoded runs-on value (e.g. "ubuntu-latest" or "[\"self-hosted\",\"aws\",\"spot\"]")'
        type: string
        default: '"ubuntu-latest"'
      ref:
        description: 'Ref of this repo to load prompts, scripts and the Slack action from (tag / branch / sha). Empty means the commit of this workflow that is running, so a caller pinned by tag or SHA gets prompts and scripts from the same commit (#25)'
        type: string
        default: ''
      slack_notify:
        description: 'Whether to send a Slack notification after the run'
        type: boolean
        default: false
      extra_prompt:
        description: 'Optional repo-specific addendum appended after the stack prompt. Use this for short inline notes; for long-form content prefer extra_prompt_path.'
        type: string
        default: ''
      extra_prompt_path:
        description: 'Optional path (relative to the consumer repo root) to a markdown file whose contents are appended after the stack prompt — e.g. .github/review-extras.md. Cleaner than a multi-line YAML string for long-form repo-specific conventions. If both extra_prompt and extra_prompt_path are set, both are appended (file contents first, then inline string).'
        type: string
        default: ''
      require_role_on_private:
        description: 'On a private repo, start a review from an @claude comment only when its author is an owner, member or collaborator, as on a public repo. Off by default: author_association can report a member whose organisation membership is private as CONTRIBUTOR or NONE (#64)'
        type: boolean
        default: false
    secrets:
      claude_oauth_token:
        required: true
      slack_webhook_url:
        required: false

jobs:
  claude:
    # On a public repo anyone can comment, and each comment spends the
    # caller's API quota; only people with a role in the repo may trigger it.
    # Private repos skip the check unless require_role_on_private is set: only
    # people with access can comment, and author_association can misreport
    # private org membership (#64).
    # A comment counts only when it is new: an edited or deleted one would
    # bill another review.
    if: >
      github.event_name == 'pull_request' ||
      (github.event.action == 'created' &&
      ((github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude'))) &&
      ((github.event.repository.private && !inputs.require_role_on_private) ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ${{ fromJSON(inputs.runner) }}
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    # No id-token: claude-code-action is given this job's token below, so it
    # has no OIDC exchange to make (#66).
    steps:
      - name: Check the stack
        # Its own step, before anything else, as in the Gemini workflow. The
        # stack names a file, prompts/<stack>.md; a path such as ../x would
        # read another file into the prompt (#58).
        env:
          STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          if ! [[ "$STACK" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::stack must be a prompt name such as python (lowercase letters, digits and -), got '${STACK}'"; exit 1
          fi

      - name: Checkout consumer repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Keeps the default persist-credentials: claude-code-action fetches
          # the PR branch with these credentials, and a private repo fails
          # without them. The file they live in is on the Read deny list below.

      - name: Clear the action folder
        # The consumer checkout is the pull request's tree, which could hold its own
        # .claude-review-action, a symlink to a runner folder included. Remove the
        # link or folder itself (rm without a trailing slash never follows a link)
        # before the action repo is checked out into that path.
        run: rm -rf -- .claude-review-action

      - name: Checkout review action repo (prompts)
        id: action-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow's own repository and commit unless the caller names a
          # ref (#25), so a fork's workflow loads the fork's prompts. job.workflow_*
          # is empty on GitHub Enterprise Server; v1 here is the old default, not
          # this repo's default branch.
          repository: ${{ job.workflow_repository || 'jadedm/pr-review-workflows' }}
          ref: ${{ inputs.ref || job.workflow_sha || 'v1' }}
          path: .claude-review-action
          token: ${{ github.token }}
          persist-credentials: false

      - name: Compose prompt
        id: prompt
        env:
          # IMPORTANT: pass user-controlled inputs via env, NEVER interpolate
          # ${{ inputs.* }} directly into bash. Direct interpolation lets
          # backticks / $(...) inside a consumer's extra_prompt run as shell
          # commands in the runner where claude_oauth_token is exported.
          STACK: ${{ inputs.stack }}
          EXTRA_PROMPT: ${{ inputs.extra_prompt }}
          EXTRA_PROMPT_PATH: ${{ inputs.extra_prompt_path }}
          REPO_FULL_NAME: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          ROOT=".claude-review-action"
          BASE="$ROOT/prompts/base.md"
          STACK_FILE="$ROOT/prompts/${STACK}.md"
          # Instructions only Claude can follow (the inline comment tool) go
          # last, in their own file: Gemini reads base.md too (#69).
          TAIL="$ROOT/prompts/_claude-tail.md"

          if [ ! -f "$BASE" ]; then
            echo "::error::base prompt not found at $BASE"; exit 1
          fi
          # A ref from before the tail existed keeps working: its base.md
          # carries that release's own output instructions.
          if [ ! -f "$TAIL" ]; then
            echo "::warning::Claude prompt tail not found at $TAIL; reviewing without it"
            TAIL=/dev/null
          fi
          if [ ! -f "$STACK_FILE" ]; then
            echo "::error::stack prompt '${STACK}' not found at $STACK_FILE"; exit 1
          fi

          # Optional repo-specific addendum from a file inside the
          # consumer repo. Useful when the inline `extra_prompt` string
          # gets too long to maintain in YAML. If both are set, file
          # contents render first, then the inline string — both under
          # the same "Repo-specific notes" heading.
          EXTRAS_RENDERED=0
          render_extras_header_once() {
            if [ "$EXTRAS_RENDERED" -eq 0 ]; then
              echo ""
              echo "## Repo-specific notes"
              echo ""
              EXTRAS_RENDERED=1
            fi
          }

          # The review rules come from the pull request's base commit, never its
          # checkout, so a pull request cannot rewrite the instructions its own
          # review follows; a change to them applies from the next one (#37).
          EXTRAS_FILE="$RUNNER_TEMP/review-extras.md"
          rm -f "$EXTRAS_FILE"
          if [ -n "$EXTRA_PROMPT_PATH" ]; then
            python3 -I "$ROOT/scripts/base_file.py" "$REPO_FULL_NAME" "$PR_NUMBER" "$EXTRA_PROMPT_PATH" "$EXTRAS_FILE"
          fi

          {
            echo "REPO: ${REPO_FULL_NAME}"
            echo "PR NUMBER: ${PR_NUMBER}"
            echo ""
            cat "$BASE"
            echo ""
            cat "$STACK_FILE"
            if [ -s "$EXTRAS_FILE" ]; then
              render_extras_header_once
              cat < "$EXTRAS_FILE"
            fi
            if [ -n "$EXTRA_PROMPT" ]; then
              render_extras_header_once
              printf '%s\n' "$EXTRA_PROMPT"
            fi
            echo ""
            cat "$TAIL"
          } > /tmp/prompt.md

          # A random end marker: the prompt holds the pull request's extras file, and
          # a line equal to a fixed marker would end the value early and write the
          # lines after it as outputs of this step (#35).
          end="PROMPT_$(python3 -I -c 'import secrets; print(secrets.token_hex(16))')"
          {
            echo "PROMPT<<${end}"
            cat /tmp/prompt.md
            echo "${end}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude review
        id: claude-review
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.claude_oauth_token }}
          # This job's token, limited to the permissions above. Without it the
          # action trades an OIDC token for its GitHub App's token, which can
          # also write the repository's contents (#66). Comments are then
          # posted as github-actions[bot].
          github_token: ${{ github.token }}
          track_progress: true
          include_fix_links: true
          classify_inline_comments: true
          prompt: ${{ steps.prompt.outputs.PROMPT }}
          # track_progress puts the action in tag mode, which lets Claude edit
          # files (acceptEdits) and run git add, commit, rm and a push wrapper
          # that accepts any branch name, all on its GitHub token. On a
          # fork's pull request the fork's commits sit in a local branch, so
          # the wrapper alone could push them into this repo. A reviewer has no
          # reason to write. use_commit_signing swaps the git commands and the
          # wrapper for two GitHub file tools, and also turns off the action's
          # own auto-commit at cleanup; the deny list then removes those tools
          # and the file edit tools. Deny rules win over the action's allow list,
          # and over a consumer's committed .claude/settings.json, which could
          # otherwise allow git or gh with the token already in the remote URL
          # and in GH_TOKEN.
          #
          # Tag mode also allows Read, Grep and Glob with no path limit, so text
          # in the pull request could have the reviewer quote its own
          # credentials into a comment. The Read rules cover the known stores:
          # process environments (/proc), credential folders in the home folder
          # (not the whole home folder: hosted runners check out under it), the
          # runner's workflow command and credential files in its temp folder
          # (the rest of it holds CI logs the reviewer may read), the runner's
          # own registration files and logs, and .git folders under the working
          # directory (the consumer checkout's holds the job token in its git
          # config). Claude Code applies Read rules to Grep and Glob on a
          # best-effort basis. The prompts checkout keeps no token on disk.
          #
          # The action also runs Claude with acceptEdits, which approves some
          # shell file commands without a rule naming them. A reviewer needs
          # none, so --permission-mode default replaces it; the action's own
          # flag comes first and a later single-value flag wins.
          #
          # The inline comment tool is installed only when --allowedTools names
          # it (install-mcp-server.ts in the pinned action); without it every
          # review was a single summary comment (#21). It adds to the action's
          # own allowed list, as in the action's pr-review example.
          use_commit_signing: true
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Bash(git commit:*),Bash(git push:*),Bash(git tag:*),Bash(gh:*),Read(//proc/**),Read(~/.claude/**),Read(~/.config/**),Read(~/.ssh/**),Read(~/.docker/**),Read(~/.git-credentials),Read(~/.gitconfig),Read(~/.aws/**),Read(~/.kube/**),Read(~/.azure/**),Read(~/.gnupg/**),Read(~/.npmrc),Read(~/.netrc),Read(~/.pypirc),Read(//**/_temp/_runner_file_commands/**),Read(//**/_temp/git-credentials-*),Read(//**/.credentials),Read(//**/.credentials_rsaparams),Read(//**/.runner),Read(//**/_diag/**),Read(**/.git/**)" --permission-mode default

      - name: Install GitHub CLI
        # The notice below calls gh, and self-hosted runners may not have it: a
        # skip then failed with exit 127 and posted nothing (#50). Same script as
        # the Gemini workflow's step, which a test keeps identical, and the same
        # condition as the notice, so a reviewed run never pays for it.
        if: success() && steps.claude-review.outputs.conclusion == ''
        run: |
          set -euo pipefail
          if ! command -v gh &> /dev/null; then
            if command -v dnf &> /dev/null; then
              sudo dnf install -y 'dnf-command(config-manager)' || true
              # dnf5 (Fedora 41 and later) renamed --add-repo.
              sudo dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo \
                || sudo dnf config-manager addrepo --from-repofile=https://cli.github.com/packages/rpm/gh-cli.repo
              sudo dnf install -y gh
            elif command -v apt-get &> /dev/null; then
              type -p curl >/dev/null || sudo apt-get install -y curl
              # Downloaded and checked before anything is written: a failed curl
              # piped into the keyring left it empty, and the apt source added
              # next then broke apt-get update for every later job on a
              # self-hosted machine (#50).
              keyring=$(mktemp)
              curl -fsSL -o "$keyring" https://cli.github.com/packages/githubcli-archive-keyring.gpg
              test -s "$keyring"
              sudo install -m 0644 "$keyring" /usr/share/keyrings/githubcli-archive-keyring.gpg
              rm -f "$keyring"
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
              sudo apt-get update && sudo apt-get install -y gh
            fi
          fi
          command -v gh > /dev/null || { echo "::error::gh is not installed, and neither dnf nor apt-get is here to install it"; exit 1; }

      - name: Say when Claude did not review
        id: skipped
        # claude-code-action sets its conclusion output only when Claude ran.
        # When it stops early it can exit green with a warning in the log and
        # nothing on the pull request, so a green check read as reviewed (#15).
        # Say so on the pull request, once per marker key (below). Its workflow validation skip, the
        # case this was written for, comes from the App token exchange and no
        # longer happens with github_token (#66); the notice stays for any
        # other early exit. This rests on the pinned action (v1.0.251): a run
        # sets conclusion only on success (src/entrypoints/run.ts:315), and a
        # failed run throws, turning the step red. Recheck when the pin moves.
        #
        # Claude posts as github-actions[bot] too (#66), so login and a fixed
        # marker could not tell this notice from a Claude comment quoting it
        # (#68). The marker carries an HMAC of the repository and pull request
        # keyed with the OAuth secret; it differs per pull request, so one seen
        # elsewhere does not count here. Claude's process holds that secret, so
        # this rests on the same rules that keep the token from it: Read is
        # denied on /proc, and with use_commit_signing the action allows no
        # shell command, env included (src/modes/tag/index.ts). A new key (a rotated
        # token) or an empty one means one more notice, never a missing one.
        if: success() && steps.claude-review.outputs.conclusion == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          MARKER_KEY: ${{ secrets.claude_oauth_token }}
        run: |
          set -euo pipefail
          echo "reviewed=false" >> "$GITHUB_OUTPUT"
          tag=$(python3 -I -c 'import hmac, os; print(hmac.new(os.environ["MARKER_KEY"].encode(), ("not reviewed " + os.environ["REPO"] + "#" + os.environ["PR_NUMBER"]).encode(), "sha256").hexdigest()[:32])')
          marker="<!-- claude-review-action: not reviewed ${tag} -->"
          count() { awk '{ n += $1 } END { print n + 0 }'; }  # --paginate prints one count per page
          said=0
          if [ -z "$MARKER_KEY" ]; then
            echo "No key for the marker; not checking for an earlier notice."
          else
            said=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))] | length" | count)
          fi
          why="claude-code-action stopped before reviewing; this run's log says why."
          echo "::warning::Claude did not review this pull request. ${why}"
          if [ "$said" -gt 0 ]; then
            echo "Already said on this pull request; not posting again."
            exit 0
          fi
          printf '%s\n\n**Claude did not review this pull request.** %s\n' "$marker" "$why" > "$RUNNER_TEMP/not-reviewed.md"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/not-reviewed.md"

      - name: Check the reviewer changed no files
        # A tripwire, not a proof: it sees tracked and untracked changes in the
        # checkout, such as an edit some future change lets through. It does
        # not see the excluded paths, ignored files, or anything outside the
        # checkout. claude-code-action restores these paths from the base
        # branch on pull requests and leaves them modified on purpose
        # (SENSITIVE_PATHS in its restore-config.ts), and the prompts checkout
        # lives inside the workspace, so all are excluded.
        if: always()
        run: |
          set -euo pipefail
          changes=$(git status --porcelain -- . \
            ':(exclude).claude-review-action' \
            ':(exclude).claude' ':(exclude).mcp.json' ':(exclude).claude.json' \
            ':(exclude).gitmodules' ':(exclude).ripgreprc' ':(exclude).husky' \
            ':(exclude)CLAUDE.md' ':(exclude)CLAUDE.local.md')
          if [ -n "$changes" ]; then
            echo "::error::The review step changed files in the checkout; a reviewer must not write"
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: Notify Slack
        # always() still reports failed runs, but only once this repo's own
        # action is in .claude-review-action: before that checkout, the folder
        # can hold the pull request's files (#59).
        if: always() && steps.action-checkout.outcome == 'success' && inputs.slack_notify && github.event_name == 'pull_request'
        uses: ./.claude-review-action/actions/slack-notify
        with:
          webhook_url: ${{ secrets.slack_webhook_url }}
          # The action escapes the title and puts it where {title} is (#62, #75).
          title: ${{ github.event.pull_request.title }}
          message: |
            🤖 *Claude* on PR #${{ github.event.pull_request.number }}: {title}
            Repo: ${{ github.repository }} | Status: ${{ steps.skipped.outputs.reviewed == 'false' && '⚠️ Not reviewed (see the comment on the PR)' || (job.status == 'success' && '✅ Completed' || '❌ Failed') }}
            <${{ github.event.pull_request.html_url }}|View PR>
